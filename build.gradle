task compile2 {
    doLast {		
	def srcDir
        def destDir
        if (project.ext.customDirectory == '') {
            srcDir = file(source_dir)            
	    destDir = file(classes_dir)
	    delete build_dir	                        
	} else {
	    srcDir = file("$project.ext.customDirectory/$source_dir")           
	    destDir = file("$project.ext.customDirectory/$classes_dir")
	    delete "$project.ext.customDirectory/$build_dir"
	}
	destDir.mkdirs()
	ant.javac(
	    srcdir: srcDir,
            destdir: destDir,
            classpath: configurations.runtimeClasspath.asPath,
            source: '1.8',
            target: '1.8',
            encoding: 'UTF-8'
        )	
    }
}

